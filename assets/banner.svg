<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    /* Keyframe Animations */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { opacity: 0.4; }
    }
    .animated-bg-1 {
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .animated-card-1 {
      animation: float1 5s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-card-2 {
      animation: float2 7s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  
  <!-- Dynamic Glowing Background Orbs (Behind content) -->
  <circle cx="200" cy="80" r="140" fill="#7c3aed" opacity="0.25" filter="url(#glow)" class="animated-bg-1" />
  <circle cx="1000" cy="220" r="160" fill="#2563eb" opacity="0.2" filter="url(#glow)" class="animated-bg-1" />

  <!-- Background Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="300" fill="url(#grid)" />
  </g>

  <!-- Decorative Animated Card Elements in Background Right -->
  <g class="animated-card-1" opacity="0.85">
    <rect x="820" y="45" width="310" height="90" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />
    <circle cx="850" cy="75" r="14" fill="#38bdf8" opacity="0.8" />
    <rect x="875" y="65" width="140" height="10" rx="5" fill="#e2e8f0" opacity="0.8" />
    <rect x="875" y="82" width="90" height="8" rx="4" fill="#64748b" />
    <rect x="1050" y="65" width="60" height="24" rx="6" fill="#7c3aed" opacity="0.6" />
  </g>

  <g class="animated-card-2" opacity="0.85">
    <rect x="760" y="155" width="340" height="100" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />
    <rect x="785" y="180" width="40" height="40" rx="8" fill="#34d399" opacity="0.8" />
    <rect x="840" y="185" width="160" height="12" rx="6" fill="#e2e8f0" opacity="0.9" />
    <rect x="840" y="205" width="110" height="10" rx="5" fill="#64748b" />
  </g>

  <!-- Top Decorative Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" />

  <!-- Main Content Foreground -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 50)">
      <rect width="250" height="32" rx="16" fill="url(#accentGrad)" opacity="0.2" />
      <rect width="250" height="32" rx="16" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5" />
      <text x="125" y="21" text-anchor="middle" class="badge-text">⚡ CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Collaborative Workspace</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Top SaaS Platforms &amp; Open-Source Projects for Wikis, Docs &amp; Knowledge Base</text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(0, 205)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="65" y="22" text-anchor="middle" class="badge-text" fill="#38bdf8">📝 Team Wikis</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="34" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="214" y="22" text-anchor="middle" class="badge-text" fill="#34d399">🎨 Whiteboards</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="175" height="34" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="386" y="22" text-anchor="middle" class="badge-text" fill="#fbbf24">🔓 15+ Open Source</text>

      <!-- Tag 4 -->
      <rect x="486" y="0" width="150" height="34" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="561" y="22" text-anchor="middle" class="badge-text" fill="#a78bfa">☁️ 10 SaaS Tools</text>
    </g>
  </g>
</svg>
